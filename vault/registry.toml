# fleet-vault registry (T1634): names only, never a value. Installed to /etc/fleet-vault/registry.toml.
# class: free (any agent, logged) | ruled (inside its rules; outside them ask the orchestrator or the owner)
#        | critical (each use approved by the orchestrator or the owner).
# modes: proxy | op | exchange | unit. legacy: today's file under ~/agents/secrets, removed by its migration row.
# check: the rule a lease request must pass (lib/vault/grants.py); cap_usd: most a lease may spend;
# month_cap_usd: most all leases may spend in a calendar month; cost: the JSON path of a call's cost in the answer.
# routes: path prefix -> pinned host (default: the first host); methods: allowed (default GET, POST);
# oauth: the broker keeps the refresh token, refreshes and signs in itself with the client secret it names.

[secret.openrouter]
class = "ruled"
rules = "image model only on the requester's own words asking for it (concept-img --asked, T1632), within the job and month caps"
used_in = "concept-img: AI concept images (OpenRouter)"
modes = ["proxy"]
hosts = ["openrouter.ai"]
paths = ["/api/v1/"]
legacy = "openrouter.key"
reissue = "https://openrouter.ai/settings/keys"
reissue_then = "create a key, delete the old one; secret replace openrouter (or the Vault page), then one concept-img run with a lease"
check = "image-ask"
cap_usd = 2.0
month_cap_usd = 10.0
cost = "usage.cost"

[secret.discord-bot-token]
class = "free"
used_in = "discord-bot gateway (unit mode, own user) and Discord REST for the runner, the bot CLI and the liaison (proxy)"
modes = ["proxy", "unit"]
hosts = ["discord.com"]
paths = ["/api/v10/"]
methods = ["GET", "POST", "PUT", "DELETE"]
scheme = "Bot"
legacy = "discord-bot-token"
reissue = "https://discord.com/developers/applications"
reissue_then = "the app, Bot, Reset Token; secret replace discord-bot-token; then pc units restart discord-bot-gateway --system --apply"

[secret.ntfy]
class = "free"
used_in = "notify-owner and po-picks: pushes to his phone"
modes = ["op"]
hosts = ["ntfy.sh"]
reissue = "https://docs.ntfy.sh/subscribe/phone/"
reissue_then = "choose a new topic name, subscribe to it in the phone app; secret replace ntfy; a test push (secret notify) arrives"
legacy = "ntfy.env"

[secret.spotify-client]
class = "free"
used_in = "pc spotify: the Spotify Web API app, value <client id>:<client secret>; used by the broker only (spotify-token)"
legacy = "spotify.env"
reissue = "https://developer.spotify.com/dashboard"
reissue_then = "the app, rotate the client secret; secret replace spotify-client with <client id>:<client secret>"

[secret.spotify-token]
class = "free"
used_in = "pc spotify: the signed-in user's refresh token; the broker refreshes the access token itself"
modes = ["proxy"]
hosts = ["api.spotify.com", "accounts.spotify.com"]
paths = ["/v1/", "/api/token", "/authorize"]
routes = { "/v1/" = "api.spotify.com", "/api/token" = "accounts.spotify.com", "/authorize" = "accounts.spotify.com" }
methods = ["GET", "POST", "PUT"]
oauth = { client = "spotify-client", token = "/api/token", authorize = "/authorize" }
legacy = "spotify-token.json"
reissue = "https://developer.spotify.com/dashboard"
reissue_then = "after a new client: open the broker's /authorize link once and approve the Spotify sign-in; pc spotify library works"

[secret.salesforce]
class = "free"
used_in = "Salesforce sandbox (test org): a work session asks POST /session and gets a session token, never the password"
modes = ["exchange"]
hosts = ["login.salesforce.com"]
paths = ["/services/Soap/u/59.0"]
legacy = "salesforce.env"
reissue = "https://login.salesforce.com/"
reissue_then = "Settings, Change My Password; secret replace salesforce with the SF_* lines (multi-line stdin)"

[secret.fleet-backup-pass]
class = "critical"
used_in = "fleet-backup: the restic repository password"
modes = ["unit"]
legacy = "fleet-backup.pass"
reissue_then = "none: a new repo on a new stick makes its own key (fleet-backup run); the stick keeps its copy (T1623)"

# Credentials a tool owns (not sealed here): `secret reissue` lists them so one command prints the whole checklist.
[tool.github-token]
place = "gh login keyring"
reissue = "https://github.com/settings/applications"
reissue_then = "gh auth login (a narrow token: personal repos only), revoke the old one at the link"

[tool.ssh-key]
place = "~/.ssh/id_ed25519"
reissue = "https://github.com/settings/keys"
reissue_then = "ssh-keygen -t ed25519; add the new public key at the link, remove the old one"

[tool.claude-login]
place = "~/.claude/.credentials.json"
reissue_then = "claude, then /login; one browser approval"

[tool.tailscale-node]
place = "tailscaled state (root)"
reissue = "https://login.tailscale.com/admin/machines"
reissue_then = "remove the dead node, sign the new one in; one browser approval"

[tool.finance-link]
place = "~/finance/.token"
reissue_then = "none: finance-web makes a new token; he gets the new link"
