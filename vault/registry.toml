# fleet-vault registry (T1634): names only, never a value. Installed to /etc/fleet-vault/registry.toml.
# class: free (any agent, logged) | ruled (inside its rules; outside them ask the orchestrator or the owner)
#        | critical (each use approved by the orchestrator or the owner).
# modes: proxy | op | exchange | unit. legacy: today's file under ~/agents/secrets, removed by its migration row.
# check: the rule a lease request must pass (lib/vault/grants.py); cap_usd: most a lease may spend;
# month_cap_usd: most all leases may spend in a calendar month; cost: the JSON path of a call's cost in the answer.
# routes: path prefix -> pinned host (default: the first host); methods: allowed (default GET, POST);
# oauth: the broker keeps the refresh token, refreshes and signs in itself with the client secret it names.

[secret.openrouter]
class = "ruled"
rules = "image model only on the requester's own words asking for it (concept-img --asked, T1632), within the job and month caps"
used_in = "concept-img: AI concept images (OpenRouter)"
modes = ["proxy"]
hosts = ["openrouter.ai"]
paths = ["/api/v1/"]
legacy = "openrouter.key"
reissue = "https://openrouter.ai/settings/keys"
check = "image-ask"
cap_usd = 2.0
month_cap_usd = 10.0
cost = "usage.cost"

[secret.discord-bot-token]
class = "free"
used_in = "discord-bot daemon (gateway) and the liaison's REST poll"
modes = ["proxy", "unit"]
hosts = ["discord.com"]
paths = ["/api/"]
legacy = "discord-bot-token"
reissue = "https://discord.com/developers/applications"

[secret.ntfy]
class = "free"
used_in = "notify-owner and po-picks: pushes to his phone"
modes = ["op"]
legacy = "ntfy.env"

[secret.spotify-client]
class = "free"
used_in = "pc spotify: the Spotify Web API app, value <client id>:<client secret>; used by the broker only (spotify-token)"
legacy = "spotify.env"
reissue = "https://developer.spotify.com/dashboard"

[secret.spotify-token]
class = "free"
used_in = "pc spotify: the signed-in user's refresh token; the broker refreshes the access token itself"
modes = ["proxy"]
hosts = ["api.spotify.com", "accounts.spotify.com"]
paths = ["/v1/", "/api/token", "/authorize"]
routes = { "/v1/" = "api.spotify.com", "/api/token" = "accounts.spotify.com", "/authorize" = "accounts.spotify.com" }
methods = ["GET", "POST", "PUT"]
oauth = { client = "spotify-client", token = "/api/token", authorize = "/authorize" }
legacy = "spotify-token.json"
reissue = "https://developer.spotify.com/dashboard"

[secret.salesforce]
class = "free"
used_in = "Salesforce sandbox (test org): work sessions by hand"
legacy = "salesforce.env"

[secret.fleet-backup-pass]
class = "critical"
used_in = "fleet-backup: the restic repository password"
modes = ["unit"]
legacy = "fleet-backup.pass"
