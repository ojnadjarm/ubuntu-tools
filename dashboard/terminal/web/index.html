<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Terminal</title>
<link rel="stylesheet" href="/keys.css">
<script type="module" src="/keys.js"></script>
</head>
<body>
<iframe id="tty" src="/tty/" title="Shell"></iframe>
<nav class="keys" id="keys" aria-label="Terminal keys">
<button data-k="esc">Esc</button><button data-k="tab">Tab</button><button data-k="ctrl" aria-pressed="false">Ctrl</button><button data-k="^c">^C</button><button data-k="left" aria-label="Left">&larr;</button><button data-k="down" aria-label="Down">&darr;</button><button data-k="up" aria-label="Up">&uarr;</button><button data-k="right" aria-label="Right">&rarr;</button><button data-k="|">|</button><button data-k="~">~</button><button data-k="/">/</button><button data-k="-">-</button>
</nav>
</body>
</html>
