<body class="panel">
<header class="head">
  <div class="id"><b id="host">…</b><s id="idsub">panel · loading</s></div>
  <div class="gauges" id="gauges"></div>
  <div class="right"><span class="clk" id="clk">--:--:--</span><span class="ok" id="verdict" role="status" aria-live="polite">…</span><span class="stale" id="stale" hidden></span><button class="clear" id="clear" hidden title="mark everything seen" aria-live="polite">clear</button></div>
</header>
<div class="refresh" aria-hidden="true"></div>
<nav class="spine" id="spine" aria-label="Screens">
  <button data-go="sites"><em>01</em><span>Sites</span><i class="none"></i></button>
  <button data-go="services"><em>02</em><span>Services</span><i class="none"></i></button>
  <button data-go="files"><em>03</em><span>Files</span><i class="none"></i></button>
  <button data-go="docs"><em>04</em><span>Docs</span><i class="none"></i></button>
  <button data-go="notes"><em>05</em><span>Notes</span><i class="none"></i></button>
  <button data-go="machine"><em>06</em><span>Machine</span><i class="none"></i></button>
  <button data-go="style"><em>07</em><span>Style</span><i class="none"></i></button>
  <a href="/voice" data-voice title="voice training: read prompts aloud"><em>08</em><span>Voice</span><i class="none"></i></a>
</nav>
<main class="board" id="board" tabindex="0" aria-label="Board"><div class="grid" id="grid"><div class="empty">loading…</div></div></main>
<footer class="foot">
  <span><u>1</u>–<u>8</u> screens</span><span><u>←</u><u>→</u> next</span><span><u>esc</u> back</span>
  <span class="sp"></span>
  <span id="crumb">01 · sites</span>
  <span>refresh <b>30 s</b></span>
  <nav class="tabs" aria-label="Screens">
    <button data-go="sites"><em>01</em><span>Sites</span></button>
    <button data-go="services"><em>02</em><span>Services</span></button>
    <button data-go="files"><em>03</em><span>Files</span></button>
    <button data-go="docs"><em>04</em><span>Docs</span></button>
    <button data-go="notes"><em>05</em><span>Notes</span></button>
    <button data-go="machine"><em>06</em><span>Machine</span></button>
    <button data-go="style"><em>07</em><span>Style</span></button>
    <a href="/voice" data-voice><em>08</em><span>Voice</span></a>
  </nav>
</footer>

<script type="module" src="/static/js/app.js"></script>
